name: development tools

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'docs/**'
      - '*.md'
      - '.github/**'
      - 'backend/**'
      - 'ide/mcp-server/**'
      - 'ide/vscode-extension/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-checks:
    name: portable checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check development tools
        run: python scripts/dev.py doctor
      - name: Check repository and portable entry point
        run: python scripts/dev.py check repo

  windows-core:
    name: Windows backend, MCP and editor checks
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ide/vscode-extension/package-lock.json
      - name: Install Python and extension dependencies
        run: python scripts/dev.py setup python extension
      - name: Run native Windows checks (POSIX worker tests remain in Linux CI)
        run: python scripts/dev.py check python extension webide
